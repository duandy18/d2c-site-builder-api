services:
  site-builder-postgres:
    image: postgres:16
    container_name: d2c_site_builder_postgres
    environment:
      POSTGRES_USER: d2c_site_builder
      POSTGRES_PASSWORD: d2c_site_builder
      POSTGRES_DB: d2c_site_builder
    ports:
      - "${D2C_SITE_BUILDER_DB_PORT:-55435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2c_site_builder -d d2c_site_builder"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - d2c_site_builder_pgdata:/var/lib/postgresql/data

volumes:
  d2c_site_builder_pgdata:
